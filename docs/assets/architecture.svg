<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">观舌 Agent · 从一次输入，到持续对话</title>
  <desc id="desc">网页提交文字与授权照片，经过接口校验交给 Qwen Agent。Agent 调用视觉观察或本地知识检索，工具结果返回 Agent；步骤、观察结果和回答通过 NDJSON 实时反馈到网页。离线体验不调用模型。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#759185" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
      .ink{fill:#244b3f}.muted{fill:#73857b}.body{font-size:17px;fill:#536c60}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px}.line{fill:none;stroke:#759185;stroke-width:1.6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#f6f7f0"/>
  <rect x="1" y="1" width="1198" height="758" rx="23" fill="none" stroke="#e2e8dc"/>
  <rect x="48" y="42" width="44" height="48" rx="15" fill="#315c4f"/>
  <g transform="translate(57 52)" fill="none" stroke="#f4f5eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2C9 1 2 8 4 17c2 7 12 6 15-2 2-5 2-9 2-13Z"/><path d="M2 26 17 8M8 17l-1-6m5 2 5-1"/></g>
  <text x="108" y="64" class="ink" font-size="25" font-weight="600" letter-spacing="5">观舌</text>
  <text x="109" y="85" class="muted" font-size="10" letter-spacing="1.9">GUANSHE / HEALTH AGENT</text>
  <rect x="978" y="50" width="174" height="30" rx="15" fill="#e8eee2"/>
  <text x="1065" y="70" text-anchor="middle" class="ink" font-size="11" letter-spacing="1.7">SYSTEM OVERVIEW</text>
  <text x="48" y="148" class="ink" font-size="34" font-weight="550">从一次输入，到持续对话。</text>
  <text x="48" y="182" class="muted" font-size="16">对话收集线索 · 工具提供依据 · 过程实时可见</text>

  <rect x="48" y="224" width="240" height="300" rx="18" fill="#fffefa" stroke="#dce4d7"/>
  <text x="72" y="258" class="muted" font-size="11" letter-spacing="2">01 / WEB</text>
  <text x="72" y="297" class="ink" font-size="25" font-weight="600">文字与照片</text>
  <text x="72" y="326" class="body">React 静态网页</text>
  <path d="M72 350H264" stroke="#e3e9dd"/>
  <text x="72" y="383" class="body">说说近况，或添加照片</text>
  <text x="72" y="415" class="body">本地预览与图片压缩</text>
  <text x="72" y="447" class="body">授权后，点击开始观察</text>
  <rect x="72" y="474" width="192" height="28" rx="6" fill="#f1f4eb"/>
  <text x="168" y="493" text-anchor="middle" class="muted" font-size="12">照片仅在当前页面内保留</text>

  <path d="M288 368H328" class="line"/>
  <rect x="328" y="224" width="440" height="300" rx="18" fill="#315c4f"/>
  <text x="356" y="258" fill="#bcd0bf" font-size="11" letter-spacing="2">02 / PYTHON AGENT</text>
  <text x="356" y="297" fill="#fffef5" font-size="25" font-weight="600">理解上下文，选择下一步</text>
  <text x="356" y="327" fill="#d2dfcf" font-size="17">Qwen · qwen3.5-plus</text>
  <rect x="356" y="350" width="384" height="60" rx="10" fill="#416b5d"/>
  <text x="374" y="375" fill="#eff5e9" class="mono">FastAPI /api/agent</text>
  <text x="374" y="397" fill="#c9d9c8" font-size="13">同源校验 · 输入校验 · 超时与取消</text>
  <text x="356" y="446" fill="#e4eddd" font-size="17">理解问题 → 调用工具 → 整理回复</text>
  <text x="356" y="490" fill="#bcd0bf" font-size="13">最多 5 轮决策 / 6 次工具调用</text>

  <path d="M768 294H808" class="line" marker-start="url(#arrow)"/>
  <path d="M768 454H808" class="line" marker-start="url(#arrow)"/>
  <rect x="808" y="224" width="344" height="140" rx="18" fill="#fffefa" stroke="#dce4d7"/>
  <text x="832" y="258" class="muted" font-size="11" letter-spacing="2">03 / VISION TOOL</text>
  <text x="832" y="293" class="ink" font-size="23" font-weight="600">视觉观察</text>
  <text x="832" y="321" class="body">照片质量与可见特征</text>
  <text x="832" y="345" class="muted mono">observe_images · qwen3-vl-plus</text>
  <rect x="808" y="384" width="344" height="140" rx="18" fill="#fffefa" stroke="#dce4d7"/>
  <text x="832" y="418" class="muted" font-size="11" letter-spacing="2">04 / KNOWLEDGE TOOL</text>
  <text x="832" y="453" class="ink" font-size="23" font-weight="600">知识检索</text>
  <text x="832" y="481" class="body">本地 JSON 索引 · 关键词匹配</text>
  <text x="832" y="505" class="muted mono">search_knowledge</text>

  <path d="M548 524V566" class="line"/>
  <rect x="328" y="566" width="824" height="96" rx="18" fill="#e8eee2" stroke="#d8e2d2"/>
  <text x="356" y="603" class="ink" font-size="21" font-weight="600">实时反馈，继续对话</text>
  <text x="356" y="633" class="body">执行进度 · 照片观察结果 · 追问与回复</text>
  <rect x="978" y="589" width="146" height="48" rx="10" fill="#f8faf3"/>
  <text x="1051" y="619" text-anchor="middle" class="ink mono">NDJSON STREAM</text>
  <path d="M328 614H184Q168 614 168 598V524" class="line"/>
  <text x="48" y="706" class="muted" font-size="13">真实 AI 流程总览 · 工具结果返回 Agent；步骤、观察结果与回答以事件流更新网页。</text>
  <text x="48" y="730" class="muted" font-size="13">离线体验使用固定示例，不调用模型、不发送照片。健康观察仅供参考，不替代医生诊断。</text>
</svg>
